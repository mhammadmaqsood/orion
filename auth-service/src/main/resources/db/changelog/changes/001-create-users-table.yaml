databaseChangeLog:
  - changeSet:
      id: 001-create-users-table
      author: hammad
      changes:
        - createTable:
            tableName: users
            remarks: Stores core user identity and account information for auth-service
            columns:
              - column:
                  name: id
                  type: BIGINT
                  autoIncrement: true
                  remarks: Primary key of the user
                  constraints:
                    primaryKey: true
                    primaryKeyName: pk_users
                    nullable: false

              - column:
                  name: email
                  type: VARCHAR(255)
                  remarks: Unique login email address of the user
                  constraints:
                    nullable: false

              - column:
                  name: password_hash
                  type: VARCHAR(255)
                  remarks: BCrypt hashed password of the user
                  constraints:
                    nullable: false

              - column:
                  name: first_name
                  type: VARCHAR(100)
                  remarks: First name of the user
                  constraints:
                    nullable: false

              - column:
                  name: last_name
                  type: VARCHAR(100)
                  remarks: Last name of the user
                  constraints:
                    nullable: false

              - column:
                  name: account_status
                  type: VARCHAR(30)
                  defaultValue: ACTIVE
                  remarks: Current account status such as ACTIVE, INACTIVE, LOCKED, DISABLED
                  constraints:
                    nullable: false

              - column:
                  name: email_verified
                  type: BOOLEAN
                  defaultValueBoolean: false
                  remarks: Indicates whether the user's email has been verified
                  constraints:
                    nullable: false

              - column:
                  name: last_login_at
                  type: DATETIME
                  remarks: Timestamp of the user's most recent successful login

              - column:
                  name: created_at
                  type: DATETIME
                  defaultValueComputed: CURRENT_TIMESTAMP
                  remarks: Record creation timestamp
                  constraints:
                    nullable: false

              - column:
                  name: created_by
                  type: VARCHAR(100)
                  defaultValue: SYSTEM
                  remarks: Actor who created the record
                  constraints:
                    nullable: false

              - column:
                  name: updated_at
                  type: DATETIME
                  defaultValueComputed: CURRENT_TIMESTAMP
                  remarks: Record last update timestamp
                  constraints:
                    nullable: false

              - column:
                  name: updated_by
                  type: VARCHAR(100)
                  defaultValue: SYSTEM
                  remarks: Actor who last updated the record
                  constraints:
                    nullable: false

        - addUniqueConstraint:
            tableName: users
            columnNames: email
            constraintName: uk_users_email

        - createIndex:
            tableName: users
            indexName: idx_users_account_status
            columns:
              - column:
                  name: account_status

        - createIndex:
            tableName: users
            indexName: idx_users_created_at
            columns:
              - column:
                  name: created_at