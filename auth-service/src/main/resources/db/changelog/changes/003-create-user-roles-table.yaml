databaseChangeLog:
  - changeSet:
      id: 003-create-user-roles-table
      author: hammad
      changes:
        - createTable:
            tableName: user_roles
            remarks: Maps users to roles for authorization support
            columns:
              - column:
                  name: id
                  type: BIGINT
                  autoIncrement: true
                  remarks: Primary key of the user-role mapping
                  constraints:
                    primaryKey: true
                    primaryKeyName: pk_user_roles
                    nullable: false

              - column:
                  name: user_id
                  type: BIGINT
                  remarks: Foreign key reference to users table
                  constraints:
                    nullable: false

              - column:
                  name: role_id
                  type: BIGINT
                  remarks: Foreign key reference to roles table
                  constraints:
                    nullable: false

              - column:
                  name: created_at
                  type: DATETIME
                  defaultValueComputed: CURRENT_TIMESTAMP
                  remarks: Record creation timestamp
                  constraints:
                    nullable: false

              - column:
                  name: created_by
                  type: VARCHAR(100)
                  defaultValue: SYSTEM
                  remarks: Actor who created the record
                  constraints:
                    nullable: false

        - addForeignKeyConstraint:
            baseTableName: user_roles
            baseColumnNames: user_id
            referencedTableName: users
            referencedColumnNames: id
            constraintName: fk_user_roles_user_id

        - addForeignKeyConstraint:
            baseTableName: user_roles
            baseColumnNames: role_id
            referencedTableName: roles
            referencedColumnNames: id
            constraintName: fk_user_roles_role_id

        - addUniqueConstraint:
            tableName: user_roles
            columnNames: user_id, role_id
            constraintName: uk_user_roles_user_id_role_id

        - createIndex:
            tableName: user_roles
            indexName: idx_user_roles_user_id
            columns:
              - column:
                  name: user_id

        - createIndex:
            tableName: user_roles
            indexName: idx_user_roles_role_id
            columns:
              - column:
                  name: role_id