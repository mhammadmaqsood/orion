databaseChangeLog:
  - changeSet:
      id: 005-create-audit-table
      author: hammad
      changes:
        - createTable:
            tableName: audit_log
            remarks: Stores authentication-related audit events for traceability and security
            columns:
              - column:
                  name: id
                  type: BIGINT
                  autoIncrement: true
                  remarks: Primary key of the audit log record
                  constraints:
                    primaryKey: true
                    primaryKeyName: pk_audit_log
                    nullable: false

              - column:
                  name: user_id
                  type: BIGINT
                  remarks: Reference to user involved in the event (nullable for unknown users)

              - column:
                  name: event_type
                  type: VARCHAR(100)
                  remarks: Type of event such as LOGIN_SUCCESS, LOGIN_FAILED
                  constraints:
                    nullable: false

              - column:
                  name: event_time
                  type: DATETIME
                  defaultValueComputed: CURRENT_TIMESTAMP
                  remarks: Timestamp when the event occured
                  constraints:
                    nullable: false

              - column:
                  name: ip_address
                  type: VARCHAR(50)
                  remarks: IP address from which the event originated

              - column:
                  name: user_agent
                  type: VARCHAR(255)
                  remarks: User agent (browser/device info)

              - column:
                  name: details
                  type: VARCHAR(1000)
                  remarks: Additional event details for debugging or auditing

              - column:
                  name: created_at
                  type: DATETIME
                  defaultValueComputed: CURRENT_TIMESTAMP
                  remarks: Record creation timestamp
                  constraints:
                    nullable: false

              - column:
                  name: created_by
                  type: VARCHAR(100)
                  defaultValue: SYSTEM
                  remarks: Actor who created the record
                  constraints:
                    nullable: false

        - addForeignKeyConstraint:
            baseTableName: audit_log
            baseColumnNames: user_id
            referencedTableName: users
            referencedColumnNames: id
            constraintName: fk_audit_log_user_id

        - createIndex:
            tableName: audit_log
            indexName: idx_audit_log_user_id
            columns:
              - column:
                  name: user_id

        - createIndex:
            tableName: audit_log
            indexName: idx_audit_log_event_type
            columns:
              - column:
                  name: event_type

        - createIndex:
            tableName: audit_log
            indexName: idx_audit_log_event_time
            columns:
              - column:
                  name: event_time